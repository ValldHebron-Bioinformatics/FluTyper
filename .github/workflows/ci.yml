name: FluTyper CI

on:
  [pull_request, release]
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Unit Testing for individual modules
  nf-test:
    name: Nextflow Module Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Java
        uses: actions/setup-java@v5.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3.0.0
        with:
          version: "26.04.6"

      - name: Cache Python Packages
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mafft
          
          # Unified tool installation
          curl -fsSL "https://github.com/shenwei356/seqkit/releases/download/v2.10.1/seqkit_linux_amd64.tar.gz" | tar xz
          sudo mv seqkit /usr/local/bin/

          curl -fsSL "https://github.com/nextstrain/nextclade/releases/download/3.18.0/nextclade-x86_64-unknown-linux-musl" -o nextclade
          chmod +x nextclade && sudo mv nextclade /usr/local/bin/

          python3 -m pip install --upgrade pip
          pip install pandas openpyxl biopython numpy plotly nbformat genin2 folium

      - name: Setup nf-test
        uses: nf-core/setup-nf-test@v2.1.0
        with:
          version: '0.9.5'
          install-pdiff: true

      - name: Run Module Tests
        run: nf-test test tests/modules/*.nf.test --verbose

  # Job 2: Full pipeline testing (only runs if unit tests pass)
  integration-test:
    name: Full Pipeline Integration
    needs: [nf-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Java
        uses: actions/setup-java@v5.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v3.0.0
        with:
          version: "26.04.6"

      - name: Install System Tools & Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mafft
          
          curl -fsSL "https://github.com/shenwei356/seqkit/releases/download/v2.10.1/seqkit_linux_amd64.tar.gz" | tar xz
          sudo mv seqkit /usr/local/bin/
          
          curl -fsSL "https://github.com/nextstrain/nextclade/releases/download/3.18.0/nextclade-x86_64-unknown-linux-musl" -o nextclade
          chmod +x nextclade && sudo mv nextclade /usr/local/bin/
          
          python3 -m pip install --upgrade pip
          pip install pandas openpyxl biopython numpy plotly nbformat genin2 folium

      - name: Setup nf-test
        uses: nf-core/setup-nf-test@v2.1.0
        with:
          version: '0.9.5'
          install-pdiff: true

      - name: Run Pipeline (nf-test)
        run: nf-test test tests/main.nf.test --verbose

  # Job 3: Optional phylogenetics module (needs IQ-TREE, TreeTime, TreeCluster and R/ggtree from FluTyper_env.yaml)
  phylogenetics-test:
    name: Phylogenetics Module Tests
    needs: [nf-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Create FluTyper environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: FluTyper_env.yaml
          cache-environment: true
          # explicit (= the action's default) so the PATH step below does not depend on that default
          micromamba-binary-path: ~/micromamba-bin/micromamba

      # Nextstrain/augur env (envs/nextstrain.yaml) for the Auspice export processes: Nextflow builds it on first use
      # (conda directive) into conda.cacheDir = ~/.flutyper/conda (nf_pipeline/conf/conda.config). Cache that folder,
      # keyed on the env file, so it is solved and downloaded once, not on every run.
      - name: Cache Nextstrain conda environment
        uses: actions/cache@v5.0.5
        with:
          path: ~/.flutyper/conda
          key: ${{ runner.os }}-nextstrain-env-${{ hashFiles('envs/nextstrain.yaml') }}

      # conf/conda.config picks micromamba when it is an executable on PATH (there is no mamba/conda on PATH here);
      # the login shell only defines a `micromamba` shell function, so expose the binary's folder to later steps.
      - name: Put micromamba on PATH for Nextflow
        # No explicit `exit`: in this `bash -el` login shell, `exit` runs ~/.bash_logout, whose failing last command
        # turns `exit 0` into exit status 1 (the step then fails although micromamba was found)
        run: |
          mm=""
          for candidate in "${MAMBA_EXE:-}" "$HOME/micromamba-bin/micromamba"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then mm="$candidate"; break; fi
          done
          if [ -z "$mm" ]; then
            echo "::error::micromamba binary not found: Nextflow cannot build envs/nextstrain.yaml"
            false
          fi
          dirname "$mm" >> "$GITHUB_PATH"
          echo "micromamba: $mm"

      - name: Run Phylogenetics Module Tests
        run: nf-test test tests/modules/phylogeny/*.nf.test --verbose

      - name: Run Phylogenetics Pipeline Tests
        # ci profile: the default 12 big_mem cpus exceed the runner's cores and IQ-TREE aborts on that
        run: nf-test test tests/phylogeny.nf.test --profile ci --verbose
